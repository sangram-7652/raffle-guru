# Production topology: immutable images (no source bind mounts), php-fpm
# behind Nginx instead of the dev server, Next.js standalone server.
# Secrets are supplied via the deployment environment, never baked in or
# committed — see docs/PRODUCTION_ARCHITECTURE.md.
#
# Usage: docker compose -f docker-compose.prod.yml up --build -d

# P12.1 — every service's own stdout/stderr is rotated by Docker itself
# (the engine default `json-file` driver otherwise grows that file
# forever — there is no built-in cap). Applies regardless of what each
# service actually writes to stdout/stderr: Laravel's `stderr` log
# channel (api/queue/scheduler, see apps/api/.env.example), Nginx's
# access/error log, Next.js's own output, MySQL/Redis's own logging —
# all of it goes through the SAME container log file this caps, not
# just the Laravel-specific pieces. LOG_MAX_SIZE/LOG_MAX_FILES are
# overridable from the root .env for an operator who wants more/less
# retention without editing this file.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILES:-5}"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging
    # Intentionally no ports: — not reachable outside the compose network.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging
    # Intentionally no ports: — not reachable outside the compose network.

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
      target: prod
    restart: unless-stopped
    env_file:
      - apps/api/.env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      # P12.2 — so an operator can run `docker compose exec api php
      # artisan backup:verify` / `backup:restore` without needing a shell
      # on the scheduler container specifically. See
      # docs/BACKUPS_DISASTER_RECOVERY.md.
      - backup-data:/var/backups/raffleguru
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # php-fpm speaks fastcgi, not HTTP, so there's no curl-able endpoint —
      # a plain TCP connect to the fastcgi port is enough to confirm it's
      # accepting connections.
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  queue:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
      target: prod
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=3"]
    env_file:
      - apps/api/.env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  scheduler:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
      target: prod
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - apps/api/.env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      # P12.2 — the one place `backup:run` actually executes (see
      # routes/console.php). A named volume, not a bind mount into the
      # container filesystem: this is what makes a backup survive the
      # scheduler container being recreated. See
      # docs/BACKUPS_DISASTER_RECOVERY.md "Local backup vs. off-server
      # backup" for why this alone is still not a complete disaster
      # recovery story.
      - backup-data:/var/backups/raffleguru
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  web:
    build:
      context: ./apps/web
      dockerfile: ../../infrastructure/docker/web/Dockerfile
      target: prod
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      # See docker-compose.yml — Server Components need an internal route
      # to the API; nginx proxies it the same way for internal and
      # external callers.
      API_INTERNAL_URL: http://nginx/api
    logging: *default-logging

  nginx:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
      # Built from the same Dockerfile as api/queue/scheduler (not a
      # separate one) so this stage's COPY --from=base can never drift
      # out of sync with whatever `filament:assets` actually publishes
      # — see the Dockerfile's `nginx` stage and P11.15 in
      # docs/PRODUCTION_ARCHITECTURE.md.
      target: nginx
    restart: unless-stopped
    volumes:
      - ./infrastructure/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy
    logging: *default-logging

volumes:
  mysql-data:
  redis-data:
  # P12.2 — local backup storage. Not a substitute for off-server backup
  # storage: both still live on the same host as mysql-data, so losing the
  # server loses both. See docs/BACKUPS_DISASTER_RECOVERY.md.
  backup-data:
