# Prod + TLS terminated directly on this Nginx (P12.5, Option C in
# docs/PRODUCTION_DEPLOYMENT.md §2). This file is NOT used by default —
# docker-compose.prod.yml alone still mounts prod.conf (plain HTTP,
# unchanged) for operators using Option A (Cloudflare) or Option B (an
# external TLS-terminating load balancer), who need nothing from this
# file at all. This one is only mounted when the optional
# docker-compose.tls.yml overlay is layered on top — see that file and
# PRODUCTION_DEPLOYMENT.md §2 for the one-time certificate bootstrap
# this depends on.
#
# Everything below the first server block is IDENTICAL in substance to
# prod.conf's single server block (same routing, same reasoning for
# every location — see that file's comments) — just moved under
# `listen 443 ssl;` instead of `listen 80;`. Keep the two in sync by
# hand if routing ever changes; they are deliberately two plain files,
# not one templated/generated from the other, so either can be read and
# reasoned about on its own.

server {
    listen 80;
    server_name _;

    # Let's Encrypt's HTTP-01 challenge (certbot's --webroot plugin)
    # must be reachable over plain HTTP on the exact domain being
    # validated — this has to stay excluded from the HTTPS redirect
    # below, or renewal breaks the moment it's needed.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Every other plain-HTTP request moves to HTTPS. $host (not
    # $http_host) deliberately drops any port suffix, and this is a
    # single, static redirect target — not a loop risk for Option C
    # (this server genuinely terminates TLS on 443 below). If you later
    # put Cloudflare in front of this as well, use "Full"/"Full
    # (strict)" mode, not "Flexible" — Flexible talks plain HTTP to the
    # origin and this redirect would bounce it straight back to HTTPS,
    # which Cloudflare then re-requests as HTTP again: an infinite loop.
    # See PRODUCTION_DEPLOYMENT.md §2.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Fixed, domain-independent certificate path — see
    # PRODUCTION_DEPLOYMENT.md §2's bootstrap step: certbot is always
    # invoked with `--cert-name raffleguru`, regardless of which real
    # domain it was issued for, specifically so this path never needs to
    # embed (or be templated with) the actual domain name.
    ssl_certificate     /etc/letsencrypt/live/raffleguru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/raffleguru/privkey.pem;

    # Modern, still broadly-compatible baseline (Mozilla "Intermediate"
    # configuration) — TLS 1.0/1.1 and the older cipher suites are
    # deliberately excluded, not an oversight.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # See prod.conf for why this is needed: a bare `fastcgi_pass
    # api:9000;` / `proxy_pass http://web:3000;` resolves the compose
    # service name once at nginx startup and never again.
    resolver 127.0.0.11 valid=10s;

    # See prod.conf's identical comment — fastcgi_pass forwards nothing
    # by default, so every fastcgi block below adds HTTP_X_FORWARDED_*
    # explicitly (real client IP for rate limiting, real scheme so
    # Laravel's own HTTPS-aware behavior is correct even though
    # fastcgi_params already sets $_SERVER['HTTPS'] independently here).
    location /api {
        set $upstream_api api:9000;
        fastcgi_pass $upstream_api;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_host;
    }

    # Sanctum's CSRF-cookie endpoint (GET /sanctum/csrf-cookie) — same
    # Laravel front controller as /api, just a different route prefix.
    location /sanctum {
        set $upstream_api api:9000;
        fastcgi_pass $upstream_api;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_host;
    }

    # Filament admin panel (P11) — same reasoning as prod.conf: without
    # this, "/admin" falls into the catch-all `location /` below and is
    # served (wrongly) by Next.js instead of Laravel.
    location = /admin {
        set $upstream_api api:9000;
        fastcgi_pass $upstream_api;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_host;
    }

    location /admin/ {
        set $upstream_api api:9000;
        fastcgi_pass $upstream_api;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_host;
    }

    # Livewire's update/asset endpoints — see prod.conf for why this
    # matches the /livewire-{8 hex chars}/ STRUCTURE rather than a
    # hardcoded hash.
    location ~ "^/livewire-[0-9a-f]{8}/" {
        set $upstream_api api:9000;
        fastcgi_pass $upstream_api;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_host;
    }

    # Filament's published static assets (CSS/JS/fonts) — baked into
    # this nginx image at build time, same as prod.conf.
    location ~ ^/(css|js|fonts)/filament/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        set $upstream_web web:3000;
        proxy_pass http://$upstream_web;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
