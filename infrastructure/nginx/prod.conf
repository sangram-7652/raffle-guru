# Prod: web is a standalone Next.js server (proxied), api is php-fpm
# (fastcgi) — no shared volume with php-fpm is needed since nginx never
# serves Laravel's static files directly, only proxies through PHP.

server {
    listen 80;
    server_name _;

    location /api {
        fastcgi_pass api:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param REQUEST_URI $request_uri;
    }

    # Sanctum's CSRF-cookie endpoint (GET /sanctum/csrf-cookie) — same
    # Laravel front controller as /api, just a different route prefix.
    location /sanctum {
        fastcgi_pass api:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param REQUEST_URI $request_uri;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
