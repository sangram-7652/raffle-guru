# Prod: web is a standalone Next.js server (proxied), api is php-fpm
# (fastcgi) — no shared volume with php-fpm is needed since nginx never
# proxies Laravel application routes through anything but PHP. The one
# exception is Filament's published static assets (P11.15, see the
# `filament/` location block below): those are baked into THIS nginx
# image at build time (infrastructure/docker/php/Dockerfile's `nginx`
# stage), not served from or shared with the api container at runtime.

# Redirect domain traffic to HTTPS.
server {
    listen 80;
    server_name raffleguru.co.uk www.raffleguru.co.uk;
    return 301 https://$host$request_uri;
}

# Internal-only: the compose network's own containers (web's
# API_INTERNAL_URL=http://nginx/api, used by Server Components) reach this
# nginx over plain HTTP using the service name "nginx" as Host, which never
# matches the domain names above. Without a default_server, that traffic
# would otherwise fall through to the redirect block above (nginx picks the
# first :80 server block as default when nothing matches) and get sent to
# https://nginx/... — a hostname no certificate here covers, so the TLS
# handshake fails. This block is unreachable from outside the compose
# network and only proxies the one path Server Components actually call.
server {
    listen 80 default_server;
    server_name _;

    resolver 127.0.0.11 valid=10s;

    location /api {
        set $upstream_api api:9000;
        fastcgi_pass $upstream_api;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param REQUEST_URI $request_uri;
    }
}

server {
    listen 443 ssl;
    server_name raffleguru.co.uk www.raffleguru.co.uk;

    ssl_certificate /etc/letsencrypt/live/raffleguru.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/raffleguru.co.uk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # See dev.conf for why this is needed: a bare `fastcgi_pass api:9000;`
    # / `proxy_pass http://web:3000;` resolves the compose service name
    # once at nginx startup and never again, so it can't tolerate the
    # upstream starting after nginx or being recreated with a new address.
    resolver 127.0.0.11 valid=10s;

    # P12.5 — every fastcgi_param block below adds HTTP_X_FORWARDED_*
    # explicitly. fastcgi_pass, unlike proxy_pass, forwards nothing by
    # default: the X-Forwarded-For/-Proto/-Host headers `location /`
    # already sets via proxy_set_header for the Next.js upstream never
    # reach php-fpm for any of these fastcgi-routed paths without this.
    # Without it, Laravel sees nginx's own REMOTE_ADDR and the request
    # scheme as plain HTTP for every API/admin request regardless of the
    # real client or whether the browser used HTTPS — silently making
    # per-IP rate limiting (RateLimiter::for('login'/'payment-webhook',
    # ... in AppServiceProvider) share one bucket across every client,
    # and breaking HTTPS-aware behavior once TLS exists (see
    # PRODUCTION_DEPLOYMENT.md §2). bootstrap/app.php's trustProxies()
    # only trusts these headers from nginx's own private-network address
    # in the first place (see that file), so exposing them here does not
    # widen what an actual external client can forge.
    location /api {
        set $upstream_api api:9000;
        fastcgi_pass $upstream_api;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_host;
    }

    # Sanctum's CSRF-cookie endpoint (GET /sanctum/csrf-cookie) — same
    # Laravel front controller as /api, just a different route prefix.
    location /sanctum {
        set $upstream_api api:9000;
        fastcgi_pass $upstream_api;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_host;
    }

    # Filament admin panel (P11) — same reasoning as dev.conf: without
    # this, "/admin" falls into the catch-all `location /` below and is
    # served (wrongly) by Next.js instead of Laravel.
    location = /admin {
        set $upstream_api api:9000;
        fastcgi_pass $upstream_api;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_host;
    }

    location /admin/ {
        set $upstream_api api:9000;
        fastcgi_pass $upstream_api;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_host;
    }

    # Livewire's update/asset endpoints — see dev.conf for why this matches
    # the /livewire-{8 hex chars}/ STRUCTURE (derived from APP_KEY at
    # runtime by Livewire itself, see vendor/livewire/livewire/src/
    # Mechanisms/HandleRequests/EndpointResolver.php) rather than a
    # hardcoded hash, so an APP_KEY rotation never requires an nginx change.
    location ~ "^/livewire-[0-9a-f]{8}/" {
        set $upstream_api api:9000;
        fastcgi_pass $upstream_api;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_host;
    }

    # Filament's published static assets (CSS/JS/fonts) — plain files,
    # not a Laravel route, so this is the one path in this file served
    # directly by nginx itself rather than proxied anywhere (P11.15).
    # php-fpm's fastcgi has no equivalent of PHP's built-in dev server's
    # "serve the real file if one exists" fallback — every fastcgi
    # request reaches index.php regardless of whether the path matches a
    # file on disk, so proxying this the same way /admin is proxied would
    # 404 through Laravel's router instead of returning the actual file
    # bytes. The files themselves are baked into this nginx image at
    # build time (infrastructure/docker/php/Dockerfile's `nginx` stage,
    # COPY'd from the exact same `base` stage that runs `filament:assets`
    # for the api/queue/scheduler images), so they can never drift out of
    # sync with whatever Filament actually publishes.
    location ~ ^/(css|js|fonts)/filament/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        set $upstream_web web:3000;
        proxy_pass http://$upstream_web;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
