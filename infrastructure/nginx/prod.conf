# Prod: web is a standalone Next.js server (proxied), api is php-fpm
# (fastcgi) — no shared volume with php-fpm is needed since nginx never
# serves Laravel's static files directly, only proxies through PHP.

server {
    listen 80;
    server_name _;

    # See dev.conf for why this is needed: a bare `fastcgi_pass api:9000;`
    # / `proxy_pass http://web:3000;` resolves the compose service name
    # once at nginx startup and never again, so it can't tolerate the
    # upstream starting after nginx or being recreated with a new address.
    resolver 127.0.0.11 valid=10s;

    location /api {
        set $upstream_api api:9000;
        fastcgi_pass $upstream_api;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param REQUEST_URI $request_uri;
    }

    # Sanctum's CSRF-cookie endpoint (GET /sanctum/csrf-cookie) — same
    # Laravel front controller as /api, just a different route prefix.
    location /sanctum {
        set $upstream_api api:9000;
        fastcgi_pass $upstream_api;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param REQUEST_URI $request_uri;
    }

    # Filament admin panel (P11) — same reasoning as dev.conf: without
    # this, "/admin" falls into the catch-all `location /` below and is
    # served (wrongly) by Next.js instead of Laravel.
    location = /admin {
        set $upstream_api api:9000;
        fastcgi_pass $upstream_api;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param REQUEST_URI $request_uri;
    }

    location /admin/ {
        set $upstream_api api:9000;
        fastcgi_pass $upstream_api;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param REQUEST_URI $request_uri;
    }

    # Livewire's update/asset endpoints — see dev.conf for why this matches
    # the /livewire-{8 hex chars}/ STRUCTURE (derived from APP_KEY at
    # runtime by Livewire itself, see vendor/livewire/livewire/src/
    # Mechanisms/HandleRequests/EndpointResolver.php) rather than a
    # hardcoded hash, so an APP_KEY rotation never requires an nginx change.
    location ~ "^/livewire-[0-9a-f]{8}/" {
        set $upstream_api api:9000;
        fastcgi_pass $upstream_api;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param REQUEST_URI $request_uri;
    }

    # ⚠ Filament's published static assets (CSS/JS/fonts under
    # apps/api/public/{css,js,fonts}/filament/) are plain files, not
    # Laravel routes. This block routes the URL correctly, but — unlike
    # dev's `php -S`, which serves static files from public/ directly —
    # php-fpm here has no route matching these paths and no shared
    # filesystem with this nginx container (see the file header comment:
    # "no shared volume with php-fpm is needed since nginx never serves
    # Laravel's static files directly, only proxies through PHP"), so a
    # request that reaches this block via fastcgi will 404 through
    # Laravel's router instead of returning the actual file bytes.
    # KNOWN LIMITATION, not silently worked around: serving these bytes
    # correctly in production needs either (a) a shared/read-only volume
    # between the api image's build output and this nginx container, or
    # (b) baking public/{css,js,fonts}/filament into a custom nginx image
    # at build time, or (c) fronting them with a CDN/S3. None of those is
    # a small config-only change, and none is implemented here — tracked
    # as a follow-up (see the P11 admin-panel plan), not assumed fixed.
    location ~ ^/(css|js|fonts)/filament/ {
        set $upstream_api api:9000;
        fastcgi_pass $upstream_api;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param REQUEST_URI $request_uri;
    }

    location / {
        set $upstream_web web:3000;
        proxy_pass http://$upstream_web;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
