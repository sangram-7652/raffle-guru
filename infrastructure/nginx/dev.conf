# Dev: both upstreams are running their own dev servers, so this is a plain
# HTTP reverse proxy — no fastcgi involved.

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS (127.0.0.11) is the only resolver that knows
    # compose service names. A bare `proxy_pass http://api:8000;` resolves
    # once, at nginx startup, and nginx treats a miss at that moment as a
    # fatal config error (`host not found in upstream`) instead of retrying
    # — so it can't tolerate the api/web containers starting a beat after
    # nginx, or getting recreated later with a new address. Routing through
    # a variable defers resolution to request time and re-resolves on the
    # `valid` TTL, so nginx starts regardless of upstream readiness and
    # keeps working across `docker compose restart api`/`web` without
    # needing its own restart.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sanctum's CSRF-cookie endpoint (GET /sanctum/csrf-cookie) — needed for
    # cookie-based SPA authentication, see docs/AUTHENTICATION.md.
    location /sanctum/ {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Filament admin panel (P11) — without this, "/admin" falls through to
    # the catch-all `location /` below and is served by Next.js instead of
    # Laravel (Next.js has no such route, so it would 404 the wrong way).
    # `= /admin` + `/admin/` covers the panel root and everything under it
    # without also matching an unrelated path that merely starts with the
    # same characters (e.g. a hypothetical "/adminfoo").
    location = /admin {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Livewire's update/asset endpoints (powers every interactive Filament
    # component) live OUTSIDE the panel path, at a per-installation prefix
    # derived from APP_KEY — /livewire-{8 hex chars}/... (see
    # vendor/livewire/livewire/src/Mechanisms/HandleRequests/
    # EndpointResolver.php) — never the fixed "/livewire" path older
    # Livewire versions used. Matching the STRUCTURE (8 hex chars), not
    # today's computed hash, means this block keeps working across an
    # APP_KEY rotation with zero nginx changes — hardcoding the current
    # hash here would be exactly the kind of fragile, easy-to-silently-
    # break upstream coupling this file's `resolver`-based pattern above
    # already exists to avoid.
    location ~ "^/livewire-[0-9a-f]{8}/" {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Filament's published static assets (CSS/JS/fonts) — served as plain
    # files under apps/api/public/, not through a Laravel route. In dev,
    # the API's built-in `php -S` server (see infrastructure/docker/php/
    # Dockerfile) already serves static files from public/ directly, so
    # this just needs to reach that upstream. See prod.conf for why this
    # same block is NOT sufficient in production.
    location ~ ^/(css|js|fonts)/filament/ {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $upstream_web web:3000;
        proxy_pass http://$upstream_web;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js dev server HMR websocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
