# Dev: both upstreams are running their own dev servers, so this is a plain
# HTTP reverse proxy — no fastcgi involved.

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS (127.0.0.11) is the only resolver that knows
    # compose service names. A bare `proxy_pass http://api:8000;` resolves
    # once, at nginx startup, and nginx treats a miss at that moment as a
    # fatal config error (`host not found in upstream`) instead of retrying
    # — so it can't tolerate the api/web containers starting a beat after
    # nginx, or getting recreated later with a new address. Routing through
    # a variable defers resolution to request time and re-resolves on the
    # `valid` TTL, so nginx starts regardless of upstream readiness and
    # keeps working across `docker compose restart api`/`web` without
    # needing its own restart.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sanctum's CSRF-cookie endpoint (GET /sanctum/csrf-cookie) — needed for
    # cookie-based SPA authentication, see docs/AUTHENTICATION.md.
    location /sanctum/ {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $upstream_web web:3000;
        proxy_pass http://$upstream_web;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js dev server HMR websocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
