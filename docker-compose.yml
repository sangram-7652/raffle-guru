# Local development stack. All host ports are bound to 127.0.0.1 and use
# non-default numbers to avoid clashing with other projects on the same
# machine; the public entry point is Nginx on http://localhost:8080.
#
# apps/api/vendor is NOT volume-isolated from the bind mount — Composer
# packages are pure PHP, so install/update dependencies on the host and
# the container sees them immediately. An earlier version used a named
# volume here too, which went stale (missing packages, hard-to-diagnose
# fatal errors) every time a new dependency was added on the host without
# also rebuilding the image.
#
# apps/web/node_modules is different: it contains platform-specific
# native bindings (e.g. @next/swc-*) that must match the container's own
# libc, not the host's — so it stays in its own volume, and the web
# service runs `npm install` on every start instead (self-heals rather
# than going stale).
#
# Usage: docker compose up --build

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-raffleguru}
      MYSQL_USER: ${DB_USERNAME:-raffleguru}
      MYSQL_PASSWORD: ${DB_PASSWORD:-raffleguru}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-raffleguru_root}
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3310}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-raffleguru_root}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_FORWARD_PORT:-6390}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    # SMTP catch-all for local dev — no credentials, no real delivery,
    # no internet access required. Lets `php artisan serve`-free Docker
    # dev actually SEE outgoing mail (verification/password-reset links)
    # in a web UI instead of only in storage/logs/laravel.log. Dev-only:
    # never referenced by docker-compose.prod.yml.
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_FORWARD_PORT:-1125}:1025"
      # 8025 is Mailpit's own default and collides with other projects'
      # Mailpit containers on this machine — 8026, non-default, per this
      # file's own port-numbering convention (see the top-of-file note).
      - "127.0.0.1:${MAILPIT_UI_FORWARD_PORT:-8026}:8025"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8025/"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - apps/api/.env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Overrides apps/api/.env's MAIL_* (which stays log-only — the
      # honest default for anyone running outside this Docker stack,
      # e.g. `php artisan serve` directly). Inside this stack, route
      # real-looking SMTP traffic to the mailpit service above instead
      # — same "compose overrides .env for container-network addresses"
      # pattern already used for DB_HOST/REDIS_HOST here.
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      # The web dev container is also published directly on 127.0.0.1:3100
      # and calls this API cross-origin (NEXT_PUBLIC_API_URL points at Nginx
      # on 8080). Explicit list, dev only — production uses docker-compose.prod.yml.
      CORS_ALLOWED_ORIGINS: http://localhost:8080,http://localhost:3100
    volumes:
      - ./apps/api:/var/www/html
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/up"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  queue:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
      target: dev
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=3"]
    env_file:
      - apps/api/.env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./apps/api:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
      target: dev
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - apps/api/.env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./apps/api:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: ../../infrastructure/docker/web/Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
      # Server Components run inside this container, which can't reach the
      # public Nginx *port* the browser uses (that's a host port mapping) —
      # but nginx is still reachable by its service name on the internal
      # Docker network, and proxies exactly the same either way. See
      # src/lib/config.ts.
      API_INTERNAL_URL: http://nginx/api
    # Unlike apps/api/vendor (pure PHP, no native binaries), node_modules
    # contains platform-specific compiled bindings (e.g. @next/swc-*) — the
    # host's own node_modules is built for the host's libc and crashes
    # inside this Alpine/musl container. So node_modules stays in its own
    # volume, and `npm install` reruns on every container start (self-heals
    # instead of going stale) rather than bind-mounting it from the host.
    volumes:
      - ./apps/web:/app
      - web-node-modules:/app/node_modules
      - web-next-cache:/app/.next
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0 -p 3000"
    ports:
      - "127.0.0.1:3100:3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./infrastructure/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  web-node-modules:
  web-next-cache:
