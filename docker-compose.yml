# Local development stack. All host ports are bound to 127.0.0.1 and use
# non-default numbers to avoid clashing with other projects on the same
# machine; the public entry point is Nginx on http://localhost:8080.
#
# Usage: docker compose up --build

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-raffleguru}
      MYSQL_USER: ${DB_USERNAME:-raffleguru}
      MYSQL_PASSWORD: ${DB_PASSWORD:-raffleguru}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-raffleguru_root}
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3310}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-raffleguru_root}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_FORWARD_PORT:-6390}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - apps/api/.env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./apps/api:/var/www/html
      - api-vendor:/var/www/html/vendor
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
      target: dev
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=3"]
    env_file:
      - apps/api/.env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./apps/api:/var/www/html
      - api-vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
      target: dev
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - apps/api/.env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./apps/api:/var/www/html
      - api-vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: ../../infrastructure/docker/web/Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
    volumes:
      - ./apps/web:/app
      - web-node-modules:/app/node_modules
      - web-next-cache:/app/.next
    ports:
      - "127.0.0.1:3100:3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./infrastructure/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - web
      - api

volumes:
  mysql-data:
  redis-data:
  api-vendor:
  web-node-modules:
  web-next-cache:
