name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, bcmath, intl, zip, pcntl, pdo_mysql, pdo_sqlite
          coverage: none

      - name: Copy environment file
        run: cp .env.example .env

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          working-directory: apps/api

      - run: php artisan key:generate

      - name: Configure SQLite for CI
        run: |
          php -r "file_exists('database/database.sqlite') || touch('database/database.sqlite');"
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=$(pwd)/database/database.sqlite" >> .env
          echo "CACHE_STORE=array" >> .env
          echo "SESSION_DRIVER=array" >> .env
          echo "QUEUE_CONNECTION=sync" >> .env

      # `php artisan test` is unavailable — nunomaduro/collision registers it
      # via a deferred provider whose boot() (where it adds the command)
      # never fires for a plain execution command. vendor/bin/phpunit runs
      # the identical suite.
      #
      # --exclude-group mysql skips the real-concurrency tests (see the
      # `mysql` backend job below): they pcntl_fork() real child processes
      # expecting InnoDB row-locking across separate connections, which
      # SQLite's per-connection :memory: database cannot provide — a
      # forked child never sees the parent's uncommitted/committed rows,
      # so these fail for a reason that has nothing to do with the code
      # under test. See docs/CI_TEST_INFRASTRUCTURE.md.
      - run: vendor/bin/phpunit --exclude-group mysql

  mysql:
    name: Backend (Laravel, MySQL concurrency)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      # Ephemeral, container-local MySQL — exists only for this job's
      # lifetime, never the development/production `raffleguru` database.
      # No real secrets involved: this password is thrown away with the
      # runner. MYSQL_USER/MYSQL_PASSWORD (not root) make the official
      # image create a user whose grants are scoped to MYSQL_DATABASE
      # only — least privilege, same pattern as the local one-time setup
      # documented on TestCase::MYSQL_TEST_DATABASE.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: raffleguru_testing
          MYSQL_USER: raffleguru_ci
          MYSQL_PASSWORD: ci_test_password
          MYSQL_ALLOW_EMPTY_PASSWORD: "no"
          # A fixed (not random) root password — thrown away with the
          # runner same as everything else here — so the "Grant backup
          # verification privilege" step below can connect as root once,
          # to scope raffleguru_ci's otherwise database-only grant just
          # wide enough for P12.2's backup:verify/backup:restore tests.
          # See docs/BACKUPS_DISASTER_RECOVERY.md "Verification".
          MYSQL_ROOT_PASSWORD: ci_root_password_throwaway
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uraffleguru_ci -pci_test_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, bcmath, intl, zip, pcntl, pdo_mysql, pdo_sqlite
          coverage: none

      - name: Copy environment file
        run: cp .env.example .env

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          working-directory: apps/api

      - run: php artisan key:generate

      - name: Configure MySQL for CI
        run: |
          echo "DB_CONNECTION=mysql" >> .env
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_PORT=3306" >> .env
          echo "DB_DATABASE=raffleguru_testing" >> .env
          echo "DB_USERNAME=raffleguru_ci" >> .env
          echo "DB_PASSWORD=ci_test_password" >> .env
          echo "CACHE_STORE=array" >> .env
          echo "SESSION_DRIVER=array" >> .env
          echo "QUEUE_CONNECTION=sync" >> .env
          # P12.2 — this runner has the real Oracle MySQL client (the
          # `mysqladmin ping` below already proves it's present), not
          # mariadb-client (that's an Alpine/Docker-image-only detail —
          # see infrastructure/docker/php/Dockerfile and
          # docs/BACKUPS_DISASTER_RECOVERY.md). Both flavors accept the
          # same flags this app's backup commands pass.
          echo "BACKUP_DUMP_BINARY=mysqldump" >> .env
          echo "BACKUP_CLIENT_BINARY=mysql" >> .env

      # The `services:` healthcheck above already waits for `mysqladmin
      # ping`, but that only proves the server accepts TCP connections —
      # not that our migrations can run yet. A short explicit wait keeps
      # this job from flaking on a slow runner without inventing a second
      # healthcheck mechanism.
      - name: Wait for MySQL to accept connections
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h127.0.0.1 -P3306 -uraffleguru_ci -pci_test_password --silent && break
            sleep 2
          done

      # raffleguru_ci is deliberately scoped to raffleguru_testing.* only
      # (see the `mysql:` service block above) — nowhere near enough to
      # create the throwaway databases backup:verify/backup:restore use.
      # One root-authenticated GRANT, scoped by a wildcard to only
      # databases under this app's own backup-verification naming
      # prefix, is the CI equivalent of the one-time production grant
      # documented in docs/BACKUPS_DISASTER_RECOVERY.md "Verification" —
      # not a blanket superuser grant.
      - name: Grant backup verification database privilege
        run: |
          mysql -h127.0.0.1 -P3306 -uroot -pci_root_password_throwaway -e \
            "GRANT ALL PRIVILEGES ON \`raffleguru_backup_verify_%\`.* TO 'raffleguru_ci'@'%'; FLUSH PRIVILEGES;"

      # TestCase::createApplication() (tests/bootstrap.php) refuses to run
      # against anything except SQLite :memory: or a MySQL database whose
      # name ends in `_testing` — raffleguru_testing, created by the
      # `services:` block above, qualifies. migrate (not migrate:fresh)
      # is enough since the service container's database starts empty.
      - name: Migrate the isolated MySQL test database
        env:
          TESTING_DB: mysql
        run: php artisan migrate --force

      # TEMPORARY DEBUG STEP — diagnosing P12.2 backup:run CI failure,
      # will be removed before this PR is considered done.
      - name: DEBUG backup:run
        env:
          TESTING_DB: mysql
        run: |
          which mysqldump mysql mariadb-dump mariadb || true
          mysqldump --version || true
          mysqldump --help 2>&1 | grep -i ssl || true
          php artisan backup:run -v || true

      # Only the tests tagged #[Group('mysql')] — the real pcntl_fork()
      # concurrency suites — run here. Running the full 848-test suite a
      # second time against MySQL would roughly double this workflow's
      # cost for tests the SQLite job above already covers just as well;
      # scoping to the group that specifically needs MySQL semantics is
      # the whole point of splitting the job out. See
      # docs/CI_TEST_INFRASTRUCTURE.md.
      - name: Run MySQL concurrency tests
        env:
          TESTING_DB: mysql
        run: vendor/bin/phpunit --group mysql
